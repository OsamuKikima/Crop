    function boot(){
      render();
      dbReady.then(function(){
        usingDb = !!dbApi;
        if (!usingDb){ render(); return; }
        checkAuthAndProceed();
      });
    }

    // Gate on manager login before showing any of the normal manager
    // views. A previously-logged-in browser is remembered via
    // MANAGER_ACCOUNT_KEY in localStorage; that id is re-validated
    // against the db every time (not just trusted blindly) in case the
    // account was deleted since. With no remembered login, whether to
    // offer "first-time setup" or "login" depends on whether any
    // manager account exists yet at all.
    async function checkAuthAndProceed(){
      state.authPhase = 'checking';
      render();
      var storedId = getStoredManagerAccountId();
      if (storedId){
        try{
          var snap = await dbApi.doc('managerAccounts/'+storedId).get();
          if (snap.exists){
            var d = snap.data() || {};
            state.authAccount = {id: storedId, email: d.email};
            state.authPhase = null;
            proceedAuthed();
            return;
          }
        }catch(e){ console.warn('manager account check failed', e); }
        clearStoredManagerAccountId();
      }
      state.authAccount = null;
      try{
        var qs = await dbApi.collection('managerAccounts').limit(1).get();
        state.authPhase = qs.empty ? 'setup' : 'login';
      }catch(e){
        // Unsure whether accounts exist — never fall back to 'setup' here,
        // since that would offer open self-registration if the check
        // merely failed transiently while accounts do exist.
        console.warn('manager accounts existence check failed', e);
        state.authPhase = 'login';
      }
      state.authForm = { email:'', password:'', passwordConfirm:'', resetCode:'' };
      state.authError = null;
      render();
    }

    // Resume wherever this mode was left: teardown() only stops the
    // live listeners, it doesn't reset state.view — so if the
    // organizer had a folder open when they switched to participant
    // mode, coming back should re-subscribe that same folder's
    // entries/groups/sections (via openSession) rather than silently
    // showing a stale, no-longer-updating detail view.
    function proceedAuthed(){
      if (state.view === 'detail' && state.currentId){
        openSession(state.currentId);
      } else if (state.view === 'admins'){
        openAdmins();
      } else {
        render();
        unsubSessions = dbApi.collection('sessions').orderBy('dateISO','desc').limit(200).onSnapshot(
          function(qs){
            state.sessions = qs.docs.map(function(d){ var data=Object.assign({}, d.data()||{}, {id:d.id}); return data; });
            if (state.view === 'sessions') render();
          },
          function(err){ console.warn('sessions onSnapshot error', err); }
        );
      }
    }
    function teardown(){
      if (unsubSessions) { unsubSessions(); unsubSessions = null; }
      if (unsubCurrent) { unsubCurrent(); unsubCurrent = null; }
      if (unsubEntries) { unsubEntries(); unsubEntries = null; }
      if (unsubGroups) { unsubGroups(); unsubGroups = null; }
      if (unsubSections) { unsubSections(); unsubSections = null; }
    }
    return { boot: boot, teardown: teardown };
  })();

  /* ============================================================

  ============================================================ */
  var Participant = (function(){
    var unsubDoc = null, unsubEntriesP = null, unsubSectionsP = null;
    // Which draft object the single shared #photo-input file picker should
    // feed into — the normal entry draft, or the 記録開始前 sandbox draft —
    // set right before the picker is opened (see bindView() below).
    var __photoTarget = 'draft';

  /* ============================================================
     session id from URL
     The manager's QR/link puts session+group in BOTH the query string
     and the hash fragment (see linkFor() in the manager app), because
     it's not guaranteed which one survives the trip from a scanned QR
     link through to this page on every device/browser — whichever is
     present here wins, query string first.
  ============================================================ */
  function extractParams(urlLike){
    // Accepts a full URL string, a bare query string, or a bare hash string
    // and returns whatever session/group params it can find in either its
    // search or hash portion.
    if (!urlLike) return null;
    try{
      var qIdx = urlLike.indexOf('?');
      var hIdx = urlLike.indexOf('#');
      var search = qIdx === -1 ? '' : urlLike.slice(qIdx+1, hIdx === -1 ? undefined : (hIdx > qIdx ? hIdx : undefined));
      var hash = hIdx === -1 ? '' : urlLike.slice(hIdx+1);
      var p1 = new URLSearchParams(search);
      if (p1.get('session')) return p1;
      var p2 = new URLSearchParams(hash);
      if (p2.get('session')) return p2;
    }catch(e){}
    return null;
  }
  function paramsFromLocation(){
    var fromSearch = new URLSearchParams(location.search);
    if (fromSearch.get('session')) return fromSearch;
    var hash = (location.hash || '').replace(/^#/, '');
    var fromHash = new URLSearchParams(hash);
    if (fromHash.get('session')) return fromHash;
    // Some hosting paths for a shared artifact link don't carry the query
    // string or hash from the original share URL into this page's own
    // location (this page can run inside a frame whose src the host
    // controls). document.referrer sometimes still holds the original
    // URL the visitor followed, so try parsing session/group out of that
    // as a last resort before giving up.
    var fromReferrer = extractParams(document.referrer);
    if (fromReferrer) return fromReferrer;
    return fromSearch; // neither has it — fall through to the "no folder" message
  }

    hash: (function(){ try{ return location.hash; }catch(e){ return '(取得不可)'; } })(),
    referrer: (function(){ try{ return document.referrer; }catch(e){ return '(取得不可)'; } })()

  /* ============================================================
     image compression
  ============================================================ */
  function loadImageFromFile(file){
    return new Promise(function(resolve,reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){ URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function(e){ URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }
  async function compressImage(file){
    var img = await loadImageFromFile(file);
    var maxDim = 1280;
    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    var scale = Math.min(1, maxDim / Math.max(w,h));
    var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
    var canvas = document.createElement('canvas');
    canvas.width = cw; canvas.height = ch;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, cw, ch);
    var quality = 0.74;
    var dataUrl = canvas.toDataURL('image/jpeg', quality);
    var tries = 0;
    while (dataUrl.length > 200000 && quality > 0.32 && tries < 6){
      quality -= 0.09; tries++;
      dataUrl = canvas.toDataURL('image/jpeg', quality);
    }
    if (dataUrl.length > 200000){
      var scale2 = Math.sqrt(200000/dataUrl.length);
      cw = Math.max(1, Math.round(cw*scale2)); ch = Math.max(1, Math.round(ch*scale2));
      canvas.width = cw; canvas.height = ch;
      ctx.drawImage(img, 0, 0, cw, ch);
      dataUrl = canvas.toDataURL('image/jpeg', 0.6);
    }
    return {dataUrl:dataUrl, width:cw, height:ch};
  }

  function render(){

    var bannerSlot = document.getElementById('banner-slot');

      // code branch) — so browsing there doesn't avoid needing a code after
      // all. Once every visible folder is code-only, showing the hint would
      // be actively misleading, so it's suppressed in that case. While the
      // list is still loading, show it as before (state unknown yet).
      var noCodeHint = state.pickBusy || state.pickSessions.some(function(s){ return getGroupJoinMode(s) !== 'code'; });

      });
      return;
    }
    if (state.phase === 'pick-group'){
      bannerSlot.innerHTML = '';
      var groupJoinMode = getGroupJoinMode(state.pickSessionMeta);
      if (!state.pickBusy && groupJoinMode === 'code'){
        // The admin restricted this folder to code-only group entry — no

        root.innerHTML = (
          '<section class="block">' +

    var photoNote = (activePhase === 'section' && curSection && curSection.photoNote) ? String(curSection.photoNote).trim() : '';
    // The URL for this exact page cannot be shared directly — this

    // iframe, so a script here never sees the outer share link's own
    // query/hash params (confirmed empirically, not just in theory).
    // The join code is the actual working stand-in: resolved via a

    var d = state.draft;

        '<h2>語りを音声入力を使って記録する</h2>' +
        '<p class="hint" style="margin-top:-.3rem; margin-bottom:.8rem;">' +
          '下のテキスト欄をタップし、キーボードに表示される<b>🎤 音声入力ボタン</b>で話してください。話した内容がそのまま文字起こしされます。' +

          : '') +
        '<button class="photo-add-btn" id="photo-add-btn">📷 写真を追加</button>' +

  function bindView(){
    var at=document.getElementById('f-attendees'), gr=document.getElementById('f-group'), tr=document.getElementById('f-transcript');
    if (at) at.addEventListener('input', function(){ state.draft.attendees = at.value; });
    if (gr) gr.addEventListener('input', function(){ state.draft.groupNumber = gr.value; });
    if (tr) tr.addEventListener('input', function(){ state.draft.transcript = tr.value; });

    var rfName = document.getElementById('rf-name');
    if (rfName) rfName.addEventListener('input', function(){ state.reflectionDraft.name = rfName.value; });
    document.querySelectorAll('[data-rf-text]').forEach(function(ta){
      ta.addEventListener('input', function(){ state.reflectionDraft.answers[ta.dataset.rfText] = ta.value; });
    });
    document.querySelectorAll('[data-rf-score]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.reflectionDraft.answers[btn.dataset.rfScore] = Number(btn.dataset.rfScoreVal);
        render();
      });
    });
    var rfSaveBtn = document.getElementById('rf-save-btn');
    if (rfSaveBtn) rfSaveBtn.addEventListener('click', submitReflection);

    var addBtn = document.getElementById('photo-add-btn');
    if (addBtn) addBtn.addEventListener('click', function(){ __photoTarget = 'draft'; document.getElementById('photo-input').click(); });
    document.querySelectorAll('[data-rm-photo]').forEach(function(b){
      b.addEventListener('click', function(){
        state.draft.photos.splice(Number(b.dataset.rmPhoto),1);
        render();
      });
    });

    var btTranscript = document.getElementById('bt-transcript');
    if (btTranscript) btTranscript.addEventListener('input', function(){ state.beforeTestDraft.transcript = btTranscript.value; });
    var btAddBtn = document.getElementById('bt-photo-add-btn');
    if (btAddBtn) btAddBtn.addEventListener('click', function(){ __photoTarget = 'beforeTest'; document.getElementById('photo-input').click(); });
    document.querySelectorAll('[data-rm-bt-photo]').forEach(function(b){
      b.addEventListener('click', function(){
        state.beforeTestDraft.photos.splice(Number(b.dataset.rmBtPhoto),1);
        render();
      });
    });

    var saveBtn = document.getElementById('save-btn');
    if (saveBtn) saveBtn.addEventListener('click', saveEntry);

    var copyCodeBtn = document.getElementById('p-copy-code-btn');
    if (copyCodeBtn) copyCodeBtn.addEventListener('click', async function(){
      var input = document.getElementById('p-code-text');
      if (!input) return;
      try{ await navigator.clipboard.writeText(input.value); toast('コードをコピーしました'); }
      catch(e){ toast('コピーできませんでした。テキストを選択してコピーしてください'); }
    });
  }

  document.getElementById('photo-input').addEventListener('change', async function(e){
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    if (!files.length) return;
    var targetPhotos = __photoTarget === 'beforeTest' ? state.beforeTestDraft.photos : state.draft.photos;
    for (var i=0;i<files.length;i++){
      try{
        var res = await compressImage(files[i]);
        targetPhotos.push(res);
      }catch(err){ console.warn('photo compress failed', err); }
    }
    render();
  });

  async function saveEntry(){
    var d = state.draft;
    document.getElementById('form-error').innerHTML = '';
    if (!d.transcript.trim() && !d.photos.length){
      document.getElementById('form-error').innerHTML = '<p class="form-error">書き起こし・写真のいずれかを入力してください。</p>';
      return;
    }
    var btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = '保存中…';
    try{
      var entryRef = await addDoc('sessions/'+sessionId+'/entries', {
        attendees: d.attendees.trim(),
        groupNumber: d.groupNumber.trim(),
        section: currentSectionName() || '',
        transcript: d.transcript.trim(),
        photoCount: d.photos.length,
        createdAt: new Date().toISOString()
      });
      for (var i=0;i<d.photos.length;i++){
        await addDoc('sessions/'+sessionId+'/entries/'+entryRef.id+'/photos',
          Object.assign({}, d.photos[i], {order:i, createdAt:new Date().toISOString()})
        );
      }
      state.draft = { attendees: d.attendees, groupNumber: d.groupNumber, transcript:'', photos:[] };
      toast('記録を追加しました');
      render();
    }catch(err){
      console.error(err);
      document.getElementById('form-error').innerHTML = '<p class="form-error">保存に失敗しました。もう一度お試しください。</p>';
    }finally{
      btn.disabled = false; btn.textContent = 'この記録を追加する';
    }
  }

  async function submitReflection(){
    var s = state.session || {};
    var cfg = getReflectionConfig(s);
    var d = state.reflectionDraft;
    var errEl = document.getElementById('rf-form-error');
    if (errEl) errEl.innerHTML = '';
    if (cfg.nameMode === 'required' && !d.name.trim()){
      if (errEl) errEl.innerHTML = '<p class="form-error">お名前を入力してください。</p>';
      return;
    }
    var btn = document.getElementById('rf-save-btn');
    btn.disabled = true; btn.textContent = '送信中…';
    try{
      var answers = {};
      cfg.questions.forEach(function(q){
        var v = d.answers[q.id];
        if (v == null || v === '') return;
        answers[q.id] = q.type === 'score' ? Number(v) : String(v).trim();
      });
      await addDoc('sessions/'+sessionId+'/reflectionResponses', {
        name: cfg.nameMode === 'anonymous' ? '' : d.name.trim(),
        anonymous: cfg.nameMode === 'anonymous',
        groupNumber: (state.draft.groupNumber||'').trim(),
        answers: answers,
        createdAt: new Date().toISOString()
      });
      state.reflectionDraft = { name: d.name, answers:{} };
      toast('回答を送信しました。ご協力ありがとうございました');
      render();
    }catch(err){
      console.error(err);
      if (errEl) errEl.innerHTML = '<p class="form-error">送信に失敗しました。もう一度お試しください。</p>';
    }finally{
      btn.disabled = false; btn.textContent = '回答を送信する';
    }
  }

  /* ============================================================
     folder / group picker
     The share link embeds session+group in the URL, but Claude's
     artifact hosting runs this page inside a frame whose own src
     replaces the outer share URL — query string, hash, and referrer
     none survive the trip (confirmed live: location.href inside the
     frame is a platform-generated *.frame.claudeusercontent.com URL
     unrelated to the shared link). So URL params are kept only as a
     harmless fast path (extractParams()/paramsFromLocation() above)
     and the real, reliable flow is this manual picker, built on the
     same db queries already used everywhere else in the app.
  ============================================================ */
  var __pickedSessionId = null;

  async function startSessionPicker(){
    state.phase = 'pick-session';
    state.pickBusy = true;
    state.pickSessions = [];
    render();
    try{
      var qs = await dbApi.collection('sessions').orderBy('dateISO','desc').limit(50).get();
      state.pickSessions = qs.docs.map(function(d){ return Object.assign({}, d.data()||{}, {id:d.id}); });
    }catch(e){ console.warn('sessions list failed', e); }
    state.pickBusy = false;
    render();
  }

  async function choosePickedSession(sid){
    __pickedSessionId = sid;
    state.phase = 'pick-group';
    state.pickBusy = true;
    state.pickGroups = [];
    state.pickSessionMeta = null;
    state.groupCodeInput = '';
    state.groupCodeError = null;
    render();
    try{
      // Fetch the folder's own doc alongside its groups — needed to read
      // groupJoinMode, since this phase's rendering (list vs. code-only)
      // depends on it. Not cached from the folder-picker list because this
      // function is also reached directly from backToPicker(), which skips
      // that list entirely.
      var sSnap = await dbApi.doc('sessions/'+sid).get();
      state.pickSessionMeta = sSnap.exists ? sSnap.data() : null;
      var qs = await dbApi.collection('sessions/'+sid+'/groups').orderBy('order','asc').limit(200).get();
      state.pickGroups = qs.docs.map(function(d){ return Object.assign({}, d.data()||{}, {id:d.id}); });
    }catch(e){ console.warn('groups list failed', e); }
    state.pickBusy = false;
    if (!state.pickGroups.length){
      // No groups configured for this folder — nothing to choose, go
      // straight to the entry form.
      enterReady(sid, null);
      return;
    }
    render();
  }

  // The embedded code box shown on the pick-group phase when the folder's
  // groupJoinMode is 'code' — same resolution mechanism as submitJoinCode()
  // below, but scoped to the folder already chosen (__pickedSessionId) and
  // requiring the resolved code to actually be a group-level code for it.
  async function submitGroupCode(){
    var raw = (state.groupCodeInput||'').trim();
    if (!raw){ state.groupCodeError = 'コードを入力してください。'; render(); return; }
    state.groupCodeError = null;
    state.pickBusy = true;
    render();
    var resolved = await resolveJoinCode(raw);
    state.pickBusy = false;
    if (!resolved || !resolved.groupId || resolved.sessionId !== __pickedSessionId){
      state.groupCodeError = 'そのコードは見つかりませんでした。入力内容をご確認ください。';
      render();
      return;
    }
    // The draft may still be carrying a group name from a previous group
    // (e.g. the participant used "グループ選択へ" to switch groups) — make
    // sure the entry form reflects the newly-joined group, not the old one.
    var codedGroup = state.pickGroups.filter(function(x){ return x.id === resolved.groupId; })[0];
    state.draft.groupNumber = (codedGroup && codedGroup.name) ? codedGroup.name : '';
    enterReady(resolved.sessionId, resolved.groupId);
  }

  function choosePickedGroup(gid){
    var g = state.pickGroups.filter(function(x){ return x.id === gid; })[0];
    if (g && g.name) state.draft.groupNumber = g.name;
    enterReady(__pickedSessionId, gid);
  }

  function enterReady(sid, gid){
    sessionId = sid;
    groupIdParam = gid || null;
    rememberPick(sid, gid);
    loadSession({fallbackToPicker:false});
  }

  // The join-code entry point on the 'pick-session' screen — the reliable
  // stand-in for URL-based deep linking (see the join-code helpers near
  // addDoc/ensureCount): resolves the code to a {sessionId, groupId} pair
  // via a single flat-collection lookup and jumps straight to that page.
  async function submitJoinCode(){
    var raw = (state.codeInput||'').trim();
    if (!raw){ state.codeError = 'コードを入力してください。'; render(); return; }
    state.codeError = null;
    state.pickBusy = true;
    render();
    var resolved = await resolveJoinCode(raw);
    if (!resolved){
      state.pickBusy = false;
      state.codeError = 'そのコードは見つかりませんでした。入力内容をご確認ください。';
      render();
      return;
    }
    if (resolved.groupId){
      // A group-level code — honor that folder's configured group-selection
      // method. A folder-level (session-only) code is never restricted by
      // this, since choosing a folder isn't "selecting a group".
      try{
        var sSnap = await dbApi.doc('sessions/'+resolved.sessionId).get();
        var sessionMeta = sSnap.exists ? sSnap.data() : null;
        if (getGroupJoinMode(sessionMeta) === 'list'){
          state.pickBusy = false;
          state.codeError = 'このフォルダは、一覧からグループを選んで参加する方式です。フォルダを選び、グループの一覧から参加してください。';
          render();
          return;
        }
      }catch(e){ console.warn('session mode check failed', e); }
    }
    // As with submitGroupCode(): clear any stale group name left over from
    // a previously-joined group so loadSession() re-derives it fresh for
    // whichever group this code actually resolves to.
    if (resolved.groupId) state.draft.groupNumber = '';
    state.pickBusy = false;
    enterReady(resolved.sessionId, resolved.groupId || null);
  }

  /* ============================================================
     boot / session loading
  ============================================================ */
  async function loadSession(opts){
    opts = opts || {};
    state.phase = 'loading';
    render();
    var snap = await dbApi.doc('sessions/'+sessionId).get().catch(function(){ return {exists:false}; });
    if (!snap.exists){
      if (opts.fallbackToPicker){
        sessionId = null; groupIdParam = null;
        startSessionPicker();
        return;
      }
      state.phase = 'not-found';
      render();
      return;
    }
    state.session = snap.data();
    state.groupJoinCode = null;
    state.phase = 'ready';
    render();

    unsubDoc = dbApi.doc('sessions/'+sessionId).onSnapshot(function(s){
      if (s.exists){ state.session = s.data(); if (state.phase==='ready') render(); }
    });
    unsubEntriesP = dbApi.collection('sessions/'+sessionId+'/entries').orderBy('createdAt','desc').limit(50).onSnapshot(
      function(qs){
        state.entries = qs.docs.map(function(d){ var data=Object.assign({}, d.data()||{}, {id:d.id}); return data; });
        if (state.phase === 'ready') render();
      },
      function(err){ console.warn('entries onSnapshot error', err); }
    );
    unsubSectionsP = dbApi.collection('sessions/'+sessionId+'/sections').orderBy('order','asc').limit(200).onSnapshot(
      function(qs){
        state.sections = qs.docs.map(function(d){ var data=Object.assign({}, d.data()||{}, {id:d.id}); return data; });
        if (state.phase === 'ready') render();
      },
      function(err){ console.warn('sections onSnapshot error', err); }
    );

    if (groupIdParam){
      dbApi.doc('sessions/'+sessionId+'/groups/'+groupIdParam).get().then(function(gsnap){
        if (gsnap.exists){
          var gdata = gsnap.data() || {};
          var changed = false;
          if (!state.draft.groupNumber && gdata.name){ state.draft.groupNumber = gdata.name; changed = true; }
          if (gdata.joinCode && state.groupJoinCode !== gdata.joinCode){ state.groupJoinCode = gdata.joinCode; changed = true; }
          if (changed && state.phase === 'ready') render();
        }
      }).catch(function(e){ console.warn('group fetch failed', e); });
    }
  }

  async function bootInner(){
    await dbReady;
    if (!dbApi){
      state.phase = 'no-db';
      render();
      return;
    }
    if (sessionId){
      // Fast path: URL params happened to carry through this time.
      rememberPick(sessionId, groupIdParam);
      loadSession({fallbackToPicker:true});
      return;
    }
    var recalled = recallPick();
    if (recalled){
      sessionId = recalled.session;
      groupIdParam = recalled.group || null;
      loadSession({fallbackToPicker:true});
      return;
    }
    startSessionPicker();
  }

    function teardown(){
      if (unsubDoc) { unsubDoc(); unsubDoc = null; }
      if (unsubEntriesP) { unsubEntriesP(); unsubEntriesP = null; }
      if (unsubSectionsP) { unsubSectionsP(); unsubSectionsP = null; }
    }
    function boot(){ render(); bootInner(); }
    // A group link (or a remembered pick) drops the participant straight
    // into the entry form ('ready' phase) with no way back to pick a
    // different group. Exposed so the top-right chrome button can offer
    // a way out of that dead end (see updateModeSwitchBtn()). The folder
    // itself is already established at this point, so this returns
    // straight to the group list for that same folder rather than all
    // the way back to the folder list.
    function backToPicker(){
      var sid = sessionId;
      teardown();
      groupIdParam = null;
      try{ localStorage.removeItem('gijinote_last_pick'); }catch(e){}
      if (sid) choosePickedSession(sid); else startSessionPicker();
    }
    function getPhase(){ return state.phase; }
    return { boot: boot, teardown: teardown, backToPicker: backToPicker, getPhase: getPhase };
  })();

  /* ============================================================
     mode switch wiring
  ============================================================ */
  function updateModeSwitchBtn(){
    var btn = document.getElementById('mode-switch-btn');
    if (!btn) return;
    if (mode === 'manager'){
      btn.textContent = '参加者画面へ';
    } else if (Participant.getPhase() === 'ready'){
      // A group link (or a remembered pick) drops the participant
      // straight into the entry form with no way back — offer one here
      // instead of the manager-mode switch, which would otherwise be
      // the only clickable thing in the top-right corner.
      btn.textContent = 'グループ選択へ';
    } else {
      btn.textContent = '管理者はこちら';
    }
  }
  function applyModeChrome(){
    document.getElementById('brand-mark').textContent = mode === 'manager' ? 'ワークショップ記録帳 Crop' : '参加者からの記録送信 ログポスト';
    document.getElementById('brand-sub').textContent = mode === 'manager' ? 'MANAGER' : 'RECORD ENTRY';
    document.getElementById('app-root').className = 'app' + (mode === 'participant' ? ' p-mode' : '');
    document.getElementById('db-warn-slot').innerHTML = '';
    document.getElementById('banner-slot').innerHTML = '';
    document.getElementById('back-slot').innerHTML = '';
    updateModeSwitchBtn();
  }
  function switchMode(m){
    if (m === mode) return;
    if (mode === 'manager') Manager.teardown(); else Participant.teardown();
    mode = m;
    setStoredMode(m);
    applyModeChrome();
    if (mode === 'manager') Manager.boot(); else Participant.boot();
  }
  document.getElementById('mode-switch-btn').addEventListener('click', function(){
    if (mode === 'participant' && Participant.getPhase() === 'ready'){
      Participant.backToPicker();
      return;
    }
    switchMode(mode === 'manager' ? 'participant' : 'manager');
  });

  /* ============================================================
     boot
  ============================================================ */
  applyModeChrome();
  if (mode === 'manager') Manager.boot(); else Participant.boot();
})();
</script>
