<title>ワークショップ記録帳 Crop</title>
<meta name="description" content="ワークショップのフォルダを作成してQRコードを発行し、参加者は同じリンクから記録を入力。集まった記録や概要情報をCSVで書き出せる、ひとつにまとまった記録ツール。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- AIによる報告書(PDF)・まとめスライド(PPTX)生成は行わないため、
     jsPDF / html2canvas / PptxGenJS の読み込みは不要 -->
<!-- Firebase SDK（compatバージョン。<script>タグでそのまま使えます） -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
  :root{
    --paper:#faf6ec; --surface:#ffffff; --surface-2:#f2ede0;
    --ink:#20242b; --ink-soft:#585f6b; --ink-faint:#8b8f99;
    --line:#e3dac2; --line-strong:#d2c6a3;
    --accent:#1e6fea; --accent-ink:#ffffff; --accent-soft:#dbe9fe; --accent-strong:#124fb0;
    --record:#e8482e; --record-soft:#fde3da; --record-strong:#b5301a;
    --leaf:#21a366; --leaf-soft:#dcf2e6; --leaf-strong:#15794a;
    --reflect:#8b5cf6; --reflect-soft:#efe8fe; --reflect-ink:#ffffff;
    --swatch-1:#e8482e; --swatch-2:#1e6fea; --swatch-3:#ffc53d; --swatch-4:#21a366; --swatch-5:#8b5cf6;
    --shadow: 0 1px 2px rgba(32,36,43,.07), 0 6px 20px -8px rgba(32,36,43,.2);
    --font-display:'Kosugi Maru', 'Zen Kaku Gothic New', sans-serif;
    --font-body:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12161f; --surface:#1c2230; --surface-2:#242c3d;
      --ink:#eef0f5; --ink-soft:#adb3c2; --ink-faint:#767d8f;
      --line:#323a4d; --line-strong:#414a63;
      --accent:#5b9bff; --accent-ink:#0b1b33; --accent-soft:#1e2e4a; --accent-strong:#a0c8ff;
      --record:#ff6b4a; --record-soft:#3a2019; --record-strong:#ffa083;
      --leaf:#3fcc8a; --leaf-soft:#1a3c2a; --leaf-strong:#7fe3b0;
      --reflect:#b79cff; --reflect-soft:#2c2650; --reflect-ink:#1c2230;
      --swatch-1:#ff6b4a; --swatch-2:#5b9bff; --swatch-3:#ffd666; --swatch-4:#3fcc8a; --swatch-5:#b79cff;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 24px -10px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12161f; --surface:#1c2230; --surface-2:#242c3d;
    --ink:#eef0f5; --ink-soft:#adb3c2; --ink-faint:#767d8f;
    --line:#323a4d; --line-strong:#414a63;
    --accent:#5b9bff; --accent-ink:#0b1b33; --accent-soft:#1e2e4a; --accent-strong:#a0c8ff;
    --record:#ff6b4a; --record-soft:#3a2019; --record-strong:#ffa083;
    --leaf:#3fcc8a; --leaf-soft:#1a3c2a; --leaf-strong:#7fe3b0;
    --reflect:#b79cff; --reflect-soft:#2c2650; --reflect-ink:#1c2230;
    --swatch-1:#ff6b4a; --swatch-2:#5b9bff; --swatch-3:#ffd666; --swatch-4:#3fcc8a; --swatch-5:#b79cff;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 24px -10px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:.9375rem; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0; text-wrap:balance; color:var(--ink);}
  button{font-family:inherit; color:inherit;}
  input,textarea{font-family:inherit; color:inherit;}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  .app{max-width:680px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column;}
  .app::before{
    content:''; display:block; height:6px; flex:none;
    background:linear-gradient(90deg, var(--swatch-1) 0 25%, var(--swatch-2) 25% 50%, var(--swatch-3) 50% 75%, var(--swatch-4) 75% 100%);
  }

  .topbar{
    display:flex; align-items:baseline; justify-content:space-between; gap:.5rem;
    padding:1.1rem 1.1rem .9rem; border-bottom:1px solid var(--line);
  }
  .topbar .brand{display:flex; align-items:baseline; gap:.55rem;}
  .topbar .mark{font-family:var(--font-display); font-weight:800; font-size:1.2rem; letter-spacing:.02em;}
  .topbar .sub{font-size:.7rem; color:var(--ink-faint); letter-spacing:.08em;}
  .brand-icon{align-self:center; flex:none; width:1.55rem; height:1.55rem; display:block;}
  .brand-icon rect{fill:var(--leaf-soft);}
  .brand-icon .stem{stroke:var(--leaf-strong); stroke-width:1.5; fill:none; stroke-linecap:round;}
  .brand-icon .leaf{fill:var(--leaf);}
  .topbar .back{
    background:none; border:none; color:var(--accent-strong); font-size:.85rem; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:.25rem;
  }
  .db-warn{
    margin:1rem 1.1rem 0; padding:.7rem .9rem; border-radius:10px;
    background:var(--record-soft); color:var(--record-strong); font-size:.82rem; line-height:1.6;
  }

  main{flex:1; padding:1.2rem 1.1rem 4rem;}

  .field{display:flex; flex-direction:column; gap:.35rem; margin-bottom:.9rem;}
  .field label{font-size:.72rem; color:var(--ink-soft); letter-spacing:.04em;}
  .field input[type="text"], .field input[type="date"], .field textarea{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:.65rem .75rem; font-size:.9rem; color:var(--ink); width:100%;
  }
  .field input:focus, .field textarea:focus{border-color:var(--accent);}
  .row2{display:grid; grid-template-columns:1.6fr 1fr; gap:.7rem;}
  @media (max-width:460px){ .row2{grid-template-columns:1fr;} }

  section.block{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:1.2rem; margin-bottom:1.1rem; box-shadow:var(--shadow);
  }
  section.block > h2{font-size:1.05rem; margin-bottom:.8rem;}
  .hint{font-size:.75rem; color:var(--ink-faint); margin-top:.3rem; line-height:1.5;}

  .photo-rule{
    background:var(--record-soft); color:var(--record-strong); border:1.5px solid var(--record);
    border-radius:10px; padding:.7rem .9rem; margin-bottom:.9rem; font-size:.85rem; font-weight:700; line-height:1.65;
  }
  .photo-rule .tag{
    display:inline-block; font-size:.68rem; font-weight:800; letter-spacing:.06em;
    background:var(--record); color:#fff; padding:.2rem .55rem; border-radius:999px; margin-bottom:.45rem;
  }
  .photo-rule .body{white-space:pre-wrap;}

  .primary-btn{
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:12px;
    padding:.8rem 1.2rem; font-size:.9rem; font-weight:700; cursor:pointer;
  }
  .primary-btn:disabled{opacity:.5; cursor:not-allowed;}
  .ghost-btn{
    background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:10px;
    padding:.55rem .9rem; font-size:.82rem; font-weight:600; cursor:pointer;
  }
  .btn-sm{font-size:.78rem; padding:.5rem .8rem; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer; font-weight:600; color:var(--ink);}
  .btn-sm.danger{background:var(--record-soft); border-color:var(--record-soft); color:var(--record-strong);}
  .btn-sm.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  .top-actions{display:flex; justify-content:flex-end; margin-bottom:1rem;}

  .empty{text-align:center; padding:3.5rem 1rem; color:var(--ink-faint); font-size:.85rem;}
  .empty .big{font-size:2rem; margin-bottom:.6rem;}

  .s-card{
    background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--line-strong); border-radius:14px;
    padding:1rem 1.1rem; margin-bottom:.7rem; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:.8rem; cursor:pointer;
  }
  .s-card:nth-of-type(5n+1){border-left-color:var(--swatch-1);}
  .s-card:nth-of-type(5n+2){border-left-color:var(--swatch-2);}
  .s-card:nth-of-type(5n+3){border-left-color:var(--swatch-3);}
  .s-card:nth-of-type(5n+4){border-left-color:var(--swatch-4);}
  .s-card:nth-of-type(5n)  {border-left-color:var(--swatch-5);}
  .s-card .info{flex:1; min-width:0;}
  .s-card .date{font-family:var(--font-mono); font-size:.72rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .s-card h3{font-size:1rem; margin:.15rem 0 0;}
  .s-card .arrow{color:var(--ink-faint); font-size:1.1rem;}

  .session-head{margin-bottom:1.1rem;}
  .session-head .eyebrow{font-size:.68rem; letter-spacing:.16em; color:var(--ink-faint); font-family:var(--font-mono);}
  .session-head h1{font-size:1.6rem; margin:.3rem 0 .15rem;}
  .session-head .date{font-family:var(--font-mono); font-size:.85rem; color:var(--ink-soft);}
  .session-head .edit-link{background:none; border:none; color:var(--accent-strong); font-size:.76rem; font-weight:700; cursor:pointer; margin-left:.5rem;}

  .qr-wrap{display:flex; gap:1.2rem; align-items:center; flex-wrap:wrap;}
  #qr-canvas-holder{background:#fff; padding:10px; border-radius:10px; border:1px solid var(--line); flex:none;}
  .qr-side{flex:1; min-width:180px;}
  .link-row{display:flex; gap:.5rem; margin-top:.5rem;}
  .link-row input{flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:.5rem .6rem; font-size:.78rem; font-family:var(--font-mono); color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis;}
  .link-row .btn-sm{flex:none;}

  .group-card{display:flex; gap:.8rem; align-items:flex-start; padding:.9rem; border:1px solid var(--line); border-left:5px solid var(--line-strong); border-radius:12px; background:var(--surface-2); margin-bottom:.7rem;}
  .group-card:nth-of-type(5n+1){border-left-color:var(--swatch-1);}
  .group-card:nth-of-type(5n+2){border-left-color:var(--swatch-2);}
  .group-card:nth-of-type(5n+3){border-left-color:var(--swatch-3);}
  .group-card:nth-of-type(5n+4){border-left-color:var(--swatch-4);}
  .group-card:nth-of-type(5n)  {border-left-color:var(--swatch-5);}
  .group-info{flex:1; min-width:0;}
  .group-info .link-row{margin-top:.4rem;}
  .group-info input#ge-name{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:.5rem .6rem; font-size:.85rem;}

  .chip-row{display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:.8rem;}
  .chip-filter{font-size:.72rem; background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); border-radius:999px; padding:.3rem .7rem; cursor:pointer; font-weight:600;}
  .chip-filter.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  .section-pills{display:flex; flex-wrap:wrap; gap:.5rem;}
  .section-pill{
    display:inline-flex; align-items:center; gap:.3rem;
    background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line);
    border-radius:999px; padding:.35rem .5rem .35rem .85rem; font-size:.8rem; font-weight:700; cursor:pointer;
  }
  .section-pill.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .section-pill .pill-edit{background:none; border:none; color:inherit; opacity:.6; font-size:.75rem; cursor:pointer; padding:.15rem .3rem; border-radius:6px; line-height:1;}
  .section-pill .pill-edit:hover{opacity:1;}
  .section-pill.editing{background:var(--surface); border-color:var(--accent);}
  .section-pill .pill-flag{font-size:.78rem; line-height:1;}
  .section-edit-panel{
    margin-top:.7rem; padding:.8rem; border:1px solid var(--accent); border-radius:12px; background:var(--surface-2);
  }
  .section-pill.editing input{width:104px; border:1px solid var(--line); border-radius:6px; padding:.3rem .4rem; font-size:.78rem; background:var(--surface); color:var(--ink);}
  .chip-section{background:var(--accent-soft); color:var(--accent-strong);}

  .section-pill.reflection.active{background:var(--reflect); border-color:var(--reflect); color:var(--reflect-ink);}
  .section-pill.before.active{background:var(--swatch-3); border-color:var(--swatch-3); color:#20242b;}
  .before-test-note{background:var(--surface-2); color:var(--ink-soft); border:1px dashed var(--line-strong); border-radius:10px; padding:.7rem .9rem; font-size:.8rem; line-height:1.6; text-align:center;}
  .auth-card{max-width:420px; margin:1rem auto;}
  .auth-switch-link{background:none; border:none; color:var(--accent, #1e6fea); font-size:.82rem; font-weight:600; cursor:pointer; padding:.3rem 0; text-decoration:underline;}
  .reset-code-box{background:var(--record-soft); border:1px dashed var(--record-strong); border-radius:12px; padding:1rem 1.1rem; text-align:center; margin:.8rem 0;}
  .reset-code-box .code{font-family:var(--font-mono); font-size:1.4rem; font-weight:800; letter-spacing:.14em; color:var(--record-strong); margin:.3rem 0;}
  .reset-code-warn{color:var(--record-strong); font-size:.78rem; font-weight:700; line-height:1.7;}
  .admin-account-row{display:flex; align-items:center; justify-content:space-between; gap:.6rem; border:1px solid var(--line); border-radius:10px; padding:.6rem .8rem; margin-bottom:.5rem; font-size:.85rem;}
  .admin-account-row .email{font-weight:700; color:var(--ink);}
  .admin-account-row .created{font-size:.72rem; color:var(--ink-faint); font-family:var(--font-mono);}
  .reflection-edit-panel{margin-top:.7rem; padding:.8rem; border:1px solid var(--reflect); border-radius:12px; background:var(--surface-2);}
  .radio-row{display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:.4rem;}
  .radio-pill{display:inline-flex; align-items:center; gap:.35rem; font-size:.82rem; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:.4rem .8rem; cursor:pointer; font-weight:600; color:var(--ink-soft);}
  .radio-pill input{accent-color:var(--reflect); margin:0;}
  .radio-pill:has(input:checked){border-color:var(--reflect); background:var(--reflect-soft); color:var(--ink);}
  .rf-question-row{border:1px solid var(--line); border-radius:10px; padding:.7rem; margin-bottom:.6rem; background:var(--surface);}
  .rf-q-type-row{display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin-bottom:.5rem;}
  .rf-q-type-row select{border:1px solid var(--line); border-radius:6px; padding:.2rem .35rem; font-size:.78rem; background:var(--surface); color:var(--ink);}
  .rf-remove-btn{background:none; border:none; color:var(--record-strong); font-size:.78rem; font-weight:700; cursor:pointer; padding:.2rem .4rem;}
  .rf-question-row input[type="text"]{width:100%; border:1px solid var(--line); border-radius:8px; padding:.5rem .6rem; font-size:.85rem; background:var(--surface); color:var(--ink);}
  .score-input-row{display:flex; gap:.4rem; flex-wrap:wrap;}
  .score-btn{width:2.3rem; height:2.3rem; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); font-weight:700; cursor:pointer; font-size:.85rem;}
  .score-btn.active{background:var(--reflect); border-color:var(--reflect); color:var(--reflect-ink);}
  .reflection-response-card{background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--reflect); border-radius:12px; padding:.9rem 1rem; margin-bottom:.7rem; box-shadow:var(--shadow);}

  .list-toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:.7rem; gap:.6rem; flex-wrap:wrap;}
  .list-toolbar .count{font-size:.78rem; color:var(--ink-soft);}
  .select-all-check{display:inline-flex; align-items:center; gap:.4rem; font-size:.78rem; font-weight:700; color:var(--ink-soft); cursor:pointer; user-select:none;}
  .select-all-check input{width:16px; height:16px; accent-color:var(--accent); margin:0;}

  .entry{background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--line-strong); border-radius:12px; margin-bottom:.6rem; box-shadow:var(--shadow); display:flex; gap:.1rem;}
  .entry .pick{display:flex; align-items:flex-start; padding:.9rem 0 0 .8rem;}
  .entry .pick input{width:18px; height:18px; accent-color:var(--accent); margin:0;}
  .entry-main{flex:1; padding:.8rem .8rem; cursor:pointer; min-width:0;}
  .entry-top{display:flex; align-items:center; gap:.5rem; margin-bottom:.25rem; flex-wrap:wrap;}
  .entry-top .who{font-weight:700; font-size:.88rem;}
  .chip{font-size:.66rem; background:var(--surface-2); color:var(--ink-soft); border-radius:999px; padding:.12rem .5rem; font-family:var(--font-mono);}
  .entry-top .time{margin-left:auto; font-family:var(--font-mono); font-size:.68rem; color:var(--ink-faint);}
  .entry .preview{margin:0; font-size:.82rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry .icon-btn{align-self:flex-start; margin:.7rem .7rem 0 0; background:none; border:none; color:var(--ink-faint); font-size:1rem; padding:.4rem; cursor:pointer; border-radius:8px;}
  .entry .icon-btn:hover{color:var(--record-strong); background:var(--record-soft);}
  .entry-detail{padding:0 .8rem .9rem;}
  .entry-detail .full{font-size:.85rem; line-height:1.8; white-space:pre-wrap; color:var(--ink); margin:.3rem 0 .7rem;}
  .photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.4rem;}
  .photo-tile{position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:var(--surface-2);}
  .photo-tile img{width:100%; height:100%; object-fit:cover; display:block;}

  .gen-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:.5rem;
    border:none; border-radius:12px; padding:.9rem 1rem; font-size:.9rem; font-weight:700;
    cursor:pointer; margin-bottom:.7rem;
  }
  .gen-btn.pdf{background:var(--ink); color:var(--surface);}
  .gen-btn.pptx{background:var(--accent); color:var(--accent-ink);}
  .gen-btn.zip{background:var(--surface-2); color:var(--ink); border:1.5px solid var(--line-strong);}
  .gen-btn:disabled{opacity:.5; cursor:not-allowed;}
  .gen-status{font-size:.8rem; color:var(--ink-soft); min-height:1.3em; margin:-.2rem 0 .9rem; line-height:1.5;}
  .gen-status.err{color:var(--record-strong);}
  .gen-status.ok{color:var(--accent-strong); font-weight:600;}
  .spin{display:inline-block; width:.85em; height:.85em; border-radius:50%; border:2px solid currentColor; border-right-color:transparent; animation:spin .7s linear infinite; vertical-align:-.1em;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .modal-bg{position:fixed; inset:0; background:rgba(20,18,12,.45); display:flex; align-items:flex-end; justify-content:center; z-index:20; padding:1rem;}
  @media (min-width:520px){ .modal-bg{align-items:center;} }
  .modal{background:var(--surface); border-radius:16px; padding:1.2rem; max-width:420px; width:100%; box-shadow:var(--shadow); border:1px solid var(--line);}
  .modal p{font-size:.86rem; color:var(--ink); margin:0 0 1rem;}
  .modal .row{display:flex; gap:.6rem; justify-content:flex-end;}

  .toast{
    position:fixed; left:50%; bottom:1.4rem; transform:translateX(-50%) translateY(0); z-index:30;
    background:var(--ink); color:var(--paper); padding:.6rem 1rem; border-radius:999px; font-size:.8rem;
    box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  #pdf-src{position:fixed; left:-9999px; top:0; width:794px; background:#faf6ec;}

  /* ---- participant (record-entry) mode additions ---- */
  .app.p-mode{max-width:560px;}
  .mode-link{background:none; border:none; color:var(--accent-strong); font-size:.72rem; font-weight:700; cursor:pointer; white-space:nowrap; padding:0;}

  .session-banner{
    margin:1rem 1.1rem 0; padding:1rem 1.1rem; border-radius:16px;
    background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow);
  }
  .session-banner .eyebrow{font-size:.68rem; letter-spacing:.16em; color:var(--ink-faint); font-family:var(--font-mono);}
  .session-banner h1{font-size:1.3rem; margin:.3rem 0 .15rem;}
  .session-banner .date{font-family:var(--font-mono); font-size:.8rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;}

  .state-msg{

<script>
(function(){

  /* ============================================================

var firebaseConfig = {

  // when it happens as the direct, synchronous continuation of a real user
  // gesture. downloadsApi.save() is normally called after `await`ing

      'font-size:13px;font-weight:700;padding:.7rem 1rem;border-radius:10px;'+
      'box-shadow:0 4px 16px rgba(0,0,0,.28);text-decoration:none;display:block;'+
      'max-width:min(86vw,360px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'+
      'animation:__dlfin .2s ease-out;}'+

  var downloadsReady = (async function(){

      save: function(opts){

            // wrapped with that type; a Blob passed in already (photos,
            // PPTX) keeps its own type since those already download fine.
            var blob = (data instanceof Blob) ? data : new Blob([data], {type:'application/octet-stream'});

  })();

  /* ============================================================
     shared helpers (used by both modes)
  ============================================================ */
  function el(html){ var t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
  // Generate our own collision-resistant id rather than relying on the db
  // capability's built-in add()/auto-id, and write with an explicit doc id
  // (doc(id).set(...)) instead. This is a defensive measure: creating many
  // sibling documents back-to-back via collection.add() was found to
  // sometimes leave fewer documents than expected, so we take id generation
  // into our own hands everywhere documents are created.
  var __idCounter = 0;

    __idCounter++;
    return Date.now().toString(36) + '_' + __idCounter.toString(36) + '_' + Math.random().toString(36).slice(2,10);
  }
  function addDoc(collectionPath, data){
    var ref = dbApi.doc(collectionPath + '/' + newId());
    return ref.set(data).then(function(){ return ref; });
  }
  // Read back a collection after a batch of creates and fill in any
  // missing "order" indices (0..expectedCount-1), retrying a few times.
  // dataForIndex(i) returns the document body to (re)create for index i.
  async function ensureCount(collectionPath, expectedCount, dataForIndex, maxAttempts){
    maxAttempts = maxAttempts || 3;
    var docs = [];
    for (var attempt=0; attempt<maxAttempts; attempt++){
      var snap = await dbApi.collection(collectionPath).get();
      docs = snap.docs;
      var haveOrders = {};
      docs.forEach(function(d){ var v=(d.data()||{}).order; if (typeof v === 'number') haveOrders[v]=true; });
      var missing = [];
      for (var i=0;i<expectedCount;i++){ if (!haveOrders[i]) missing.push(i); }
      if (!missing.length) break;
      for (var k=0;k<missing.length;k++){
        await addDoc(collectionPath, dataForIndex(missing[k]));
      }
    }
    return docs.length;
  }
  /* ============================================================
     join codes — short, human-typeable codes that stand in for the
     session/group URL params which cannot survive the trip through
     this hosting platform's cross-origin iframe (confirmed: a
     published artifact's own script only ever sees the iframe's own
     manufactured src, never the outer share link's query/hash — see
     __diag.href in the participant picker). A code is just a doc id
     in a flat top-level collection, so resolving one is a single get()
     with no scan over every session.
  ============================================================ */
  var JOIN_CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O/1/I/L
  function randomJoinCode(len){
    len = len || 5;
    var s = '';
    for (var i=0;i<len;i++) s += JOIN_CODE_ALPHABET[Math.floor(Math.random()*JOIN_CODE_ALPHABET.length)];
    return s;
  }
  async function allocateJoinCode(sessionId, groupId){
    for (var attempt=0; attempt<8; attempt++){
      var code = randomJoinCode(5);
      var snap = await dbApi.doc('joinCodes/'+code).get();
      if (!snap.exists){
        await dbApi.doc('joinCodes/'+code).set({sessionId: sessionId, groupId: groupId || null, createdAt: new Date().toISOString()});
        return code;
      }
    }
    // Vanishingly unlikely after 8 collisions at 5 chars — widen instead
    // of failing the caller.
    var code6 = randomJoinCode(6);
    await dbApi.doc('joinCodes/'+code6).set({sessionId: sessionId, groupId: groupId || null, createdAt: new Date().toISOString()});
    return code6;
  }
  async function releaseJoinCode(code){
    if (!code) return;
    try{ await dbApi.doc('joinCodes/'+code).delete(); }catch(e){}
  }
  async function resolveJoinCode(code){
    var norm = String(code||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    if (!norm) return null;
    try{
      var snap = await dbApi.doc('joinCodes/'+norm).get();
      if (snap.exists) return snap.data();
    }catch(e){}
    return null;
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
  function todayISO(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function formatDateLabel(iso){
    if(!iso) return '日付未設定';
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    try{ return new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(d); }
    catch(e){ return iso; }
  }
  function formatTime(iso){
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    try{ return new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(d); }
    catch(e){ return ''; }
  }
  function truncate(s, n){
    s = (s||'').trim().replace(/\s+/g,' ');
    return s.length > n ? s.slice(0,n) + '…' : s;
  }

    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }
  function confirmModal(message, okLabel, okClass){
    return new Promise(function(resolve){
      var slot = document.getElementById('modal-slot');
      var m = el(
        '<div class="modal-bg" role="dialog" aria-modal="true">' +
          '<div class="modal">' +
            '<p>' + esc(message) + '</p>' +
            '<div class="row">' +
              '<button class="btn-sm" data-a="cancel">キャンセル</button>' +
              '<button class="btn-sm ' + (okClass||'danger') + '" data-a="ok">' + esc(okLabel||'削除する') + '</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      );

  function trimToUtf8Bytes(str, maxBytes){
    var enc = new TextEncoder();
    if (enc.encode(str).length <= maxBytes) return str;
    var lo=0, hi=str.length, best=0;
    while (lo<=hi){
      var mid=(lo+hi)>>1;
      if (enc.encode(str.slice(0,mid)).length<=maxBytes){ best=mid; lo=mid+1; } else { hi=mid-1; }
    }

  }

    var qs = 'session=' + encodeURIComponent(sessionId) + (groupId ? '&group=' + encodeURIComponent(groupId) : '');

  }

  function participantEntryUrl(){

  }

    if (total <= 26) return String.fromCharCode(65 + index);
    return String(index + 1);
  }
  function generateSectionName(index){ return '問い' + (index + 1); }
  // "全体のふりかえり" (post-event reflection survey) config lives directly on
  // the session doc as session.reflectionConfig — unlike 問い(sections) it
  // has no separate subcollection of its own (only the collected answers
  // do, in sessions/{id}/reflectionResponses), so both Manager and
  // Participant can read the live config for free off the session doc
  // listener they already have, with no extra subscription needed.
  function getReflectionConfig(session){
    var cfg = (session && session.reflectionConfig) || {};

  // groups configured: 'both' (default — a group's own code jumps straight
  // in, or the participant can pick from the displayed list), 'code' (the
  // list is hidden — a group code is required), or 'list' (a group-level
  // code is refused — the participant must pick from the displayed list).
  // This only concerns choosing a GROUP; a folder-level (session) code
  // always still works regardless of this setting.
  function getGroupJoinMode(session){
    var m = session && session.groupJoinMode;

  // a no-save sandbox for testing voice input / photo adding, positioned
  // ahead of 問い1), 'section' (a numbered 問い, tracked by
  // currentSectionIndex — the long-standing default), or 'reflection' (全体
  // のふりかえり). Anything else (including a legacy session that predates
  // this field) falls back to 'section', preserving old behavior exactly.
  function getActivePhase(session){
    var p = session && session.activePhase;
    return (p === 'reflection' || p === 'before') ? p : 'section';
  }
  function countSelectHtml(id, value, max, noneLabel, unitLabel){
    var v = Number(value) || 0;
    var opts = '<option value="0"' + (v===0?' selected':'') + '>' + esc(noneLabel) + '</option>';
    for (var i=1;i<=max;i++){
      opts += '<option value="' + i + '"' + (v===i?' selected':'') + '>' + i + esc(unitLabel) + '</option>';
    }

  /* ============================================================
     mode: manager (organizer) vs participant (record entry)
     Both modes now share the same db store (this artifact's own —
     the db capability is scoped per-artifact, which is exactly why
     the old two-separate-artifacts design could never share session
     data). There is no "owner" capability available on this account

  ============================================================ */

  }

  ============================================================ */
  var Manager = (function(){
  /* ============================================================

  ============================================================ */

    newForm: { title:'', dateISO: todayISO(), groupCount:0, sectionCount:0, purpose:'', location:'', participants:'', participantCount:'', industry:'', askAbout:true, groupJoinMode:'both' },
    currentId: null,
    currentSession: null,

    groupEditDraft: null,
    gen: { overviewCsv:{busy:false,msg:'',cls:''}, zip:{busy:false,msg:'',cls:''}, reflectionCsv:{busy:false,msg:'',cls:''} },
    // --- manager login/registration ---
    authAccount: null,   // {id, email} once logged in; null while gated
    authPhase: 'checking', // checking | setup | login | forgot | resetCodeShown | null(=authed)
    authForm: { email:'', password:'', passwordConfirm:'', resetCode:'' },

  };
  var unsubSessions = null, unsubCurrent = null, unsubEntries = null, unsubGroups = null, unsubSections = null, unsubReflection = null;

  /* ============================================================
     manager authentication — email + password, stored as salted
     SHA-256 hashes in a shared 'managerAccounts' collection. This is a
     UI-level gate, not a real security boundary: the db capability
     gives every viewer equal read/write access regardless of which UI
     they're looking at (see the MODE_KEY comment above), so a
     technically-inclined participant could still read the hashes or
     call these functions directly from devtools. It reliably keeps
     casual participants out of the manager screens, which is the
     actual goal here.
     There is no real email-sending capability available to a
     published artifact, so "forgot password" works via a one-time
     reset code shown once at registration time instead of an emailed
     link — the admin is responsible for storing it somewhere safe.
  ============================================================ */
  var MANAGER_ACCOUNT_KEY = 'gijinote_manager_account_id';
  function getStoredManagerAccountId(){ try{ return localStorage.getItem(MANAGER_ACCOUNT_KEY); }catch(e){ return null; } }
  function setStoredManagerAccountId(id){ try{ localStorage.setItem(MANAGER_ACCOUNT_KEY, id); }catch(e){} }
  function clearStoredManagerAccountId(){ try{ localStorage.removeItem(MANAGER_ACCOUNT_KEY); }catch(e){} }

  function randomHex(nBytes){
    var arr = new Uint8Array(nBytes);
    (window.crypto || window.msCrypto).getRandomValues(arr);
    var out = '';
    for (var i=0;i<arr.length;i++) out += arr[i].toString(16).padStart(2,'0');
    return out;
  }
  async function sha256Hex(str){
    var enc = new TextEncoder().encode(str);
    var buf = await crypto.subtle.digest('SHA-256', enc);
    var arr = Array.from(new Uint8Array(buf));
    return arr.map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }
  async function hashSecret(value, salt){ return await sha256Hex(salt + ':' + value); }
  function normalizeEmail(s){ return String(s||'').trim().toLowerCase(); }
  var RESET_CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O/1/I/L
  function randomResetCode(){
    var s = '';
    for (var i=0;i<8;i++) s += RESET_CODE_ALPHABET[Math.floor(Math.random()*RESET_CODE_ALPHABET.length)];
    return s.slice(0,4) + '-' + s.slice(4);
  }
  function normalizeResetCode(s){ return String(s||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,''); }
  function isValidEmailFormat(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s||'').trim()); }

  async function findManagerAccountByEmail(emailLower){
    try{
      var qs = await dbApi.collection('managerAccounts').limit(500).get();
      var found = null;
      qs.docs.forEach(function(d){
        var data = d.data() || {};
        if (data.emailLower === emailLower) found = Object.assign({}, data, {id: d.id});
      });
      return found;
    }catch(e){ console.warn('manager account lookup failed', e); return null; }
  }

  async function createManagerAccount(email, password, createdBy){
    var emailLower = normalizeEmail(email);
    var passwordSalt = randomHex(16);
    var passwordHash = await hashSecret(password, passwordSalt);
    var resetCode = randomResetCode();
    var resetCodeSalt = randomHex(16);
    var resetCodeHash = await hashSecret(normalizeResetCode(resetCode), resetCodeSalt);
    var doc = {
      email: String(email).trim(), emailLower: emailLower,
      passwordSalt: passwordSalt, passwordHash: passwordHash,
      resetCodeSalt: resetCodeSalt, resetCodeHash: resetCodeHash,
      createdAt: new Date().toISOString(), createdBy: createdBy || null
    };
    var ref = await addDoc('managerAccounts', doc);
    return {id: ref.id, resetCode: resetCode, email: doc.email};
  }

  async function attemptManagerLogin(email, password){
    var emailLower = normalizeEmail(email);
    var acct = await findManagerAccountByEmail(emailLower);
    if (!acct) return {ok:false, error:'メールアドレスまたはパスワードが正しくありません。'};
    var hash = await hashSecret(password, acct.passwordSalt);
    if (hash !== acct.passwordHash) return {ok:false, error:'メールアドレスまたはパスワードが正しくありません。'};
    return {ok:true, account:{id:acct.id, email:acct.email}};
  }

  async function attemptManagerReset(email, code, newPassword){
    var emailLower = normalizeEmail(email);
    var acct = await findManagerAccountByEmail(emailLower);
    if (!acct) return {ok:false, error:'メールアドレスまたは再設定コードが正しくありません。'};
    var codeHash = await hashSecret(normalizeResetCode(code), acct.resetCodeSalt);
    if (codeHash !== acct.resetCodeHash) return {ok:false, error:'メールアドレスまたは再設定コードが正しくありません。'};
    var passwordSalt = randomHex(16);
    var passwordHash = await hashSecret(newPassword, passwordSalt);
    var newResetCode = randomResetCode();
    var newResetCodeSalt = randomHex(16);
    var newResetCodeHash = await hashSecret(normalizeResetCode(newResetCode), newResetCodeSalt);
    await dbApi.doc('managerAccounts/'+acct.id).update({
      passwordSalt: passwordSalt, passwordHash: passwordHash,
      resetCodeSalt: newResetCodeSalt, resetCodeHash: newResetCodeHash,
      updatedAt: new Date().toISOString()
    });
    return {ok:true, account:{id:acct.id, email:acct.email}, resetCode:newResetCode};
  }

  function render(){
    if (mode !== 'manager') return;
    var warnSlot = document.getElementById('db-warn-slot');

      // any of the normal manager views, regardless of state.view.

      var authRoot = document.getElementById('view-root');
      authRoot.innerHTML = viewAuth();
      bindAuthView();
      warnSlot.innerHTML = usingDb ? '' :
        '<p class="db-warn">⚠️ オンライン保存機能を利用できないため、この画面は使用できません。Claudeのアーティファクトとして開いた状態でご利用ください。</p>';
      return;
    }

    document.getElementById('back-slot').innerHTML = state.view === 'sessions' ? '' :
      '<button class="back" id="back-btn">‹ フォルダ一覧</button>';
    var root = document.getElementById('view-root');
    if (state.view === 'sessions') root.innerHTML = viewSessions();
    else if (state.view === 'new') root.innerHTML = viewNew();
    else if (state.view === 'admins') root.innerHTML = viewAdmins();
    else root.innerHTML = viewDetail();
    bindView();

    warnSlot.innerHTML = usingDb ? '' :
      '<p class="db-warn">⚠️ オンライン保存機能を利用できないため、この画面は使用できません。Claudeのアーティファクトとして開いた状態でご利用ください。</p>';

    var backBtn = document.getElementById('back-btn');
    if (backBtn) backBtn.addEventListener('click', goSessions);
  }

  function bindAuthView(){
    var eEmail = document.getElementById('auth-email');
    var ePass = document.getElementById('auth-password');
    var ePassConfirm = document.getElementById('auth-password-confirm');
    var eResetCode = document.getElementById('auth-reset-code');
    if (eEmail) eEmail.addEventListener('input', function(){ state.authForm.email = eEmail.value; });
    if (ePass) ePass.addEventListener('input', function(){ state.authForm.password = ePass.value; });
    if (ePassConfirm) ePassConfirm.addEventListener('input', function(){ state.authForm.passwordConfirm = ePassConfirm.value; });
    if (eResetCode) eResetCode.addEventListener('input', function(){ state.authForm.resetCode = eResetCode.value; });

    var setupBtn = document.getElementById('auth-setup-btn');
    if (setupBtn) setupBtn.addEventListener('click', submitAuthSetup);
    var loginBtn = document.getElementById('auth-login-btn');
    if (loginBtn) loginBtn.addEventListener('click', submitAuthLogin);
    var resetBtn = document.getElementById('auth-reset-btn');
    if (resetBtn) resetBtn.addEventListener('click', submitAuthReset);
    var continueBtn = document.getElementById('auth-continue-btn');
    if (continueBtn) continueBtn.addEventListener('click', continueFromResetCodeShown);

    var gotoForgot = document.getElementById('auth-goto-forgot-btn');
    if (gotoForgot) gotoForgot.addEventListener('click', function(){
      state.authPhase = 'forgot'; state.authError = null;
      state.authForm = { email: state.authForm.email||'', password:'', passwordConfirm:'', resetCode:'' };
      render();
    });
    var gotoLogin = document.getElementById('auth-goto-login-btn');
    if (gotoLogin) gotoLogin.addEventListener('click', function(){
      state.authPhase = 'login'; state.authError = null;
      state.authForm = { email: state.authForm.email||'', password:'', passwordConfirm:'', resetCode:'' };
      render();
    });
    var copyCodeBtn = document.getElementById('auth-copy-code-btn');
    if (copyCodeBtn) copyCodeBtn.addEventListener('click', async function(){
      try{ await navigator.clipboard.writeText(state.authShownCode||''); toast('再設定コードをコピーしました'); }
      catch(e){ toast('コピーできませんでした。表示されたコードを選択してコピーしてください'); }
    });
  }

  async function submitAuthSetup(){
    var f = state.authForm;
    var email = (f.email||'').trim();
    if (!isValidEmailFormat(email)){ state.authError = 'メールアドレスの形式が正しくありません。'; render(); return; }
    if ((f.password||'').length < 8){ state.authError = 'パスワードは8文字以上にしてください。'; render(); return; }
    if (f.password !== f.passwordConfirm){ state.authError = 'パスワード（確認）が一致しません。'; render(); return; }
    state.authBusy = true; state.authError = null; render();
    try{
      var existing = await findManagerAccountByEmail(normalizeEmail(email));
      if (existing){
        state.authBusy = false; state.authError = 'このメールアドレスはすでに登録されています。ログインしてください。';
        render(); return;
      }
      var result = await createManagerAccount(email, f.password, null);
      setStoredManagerAccountId(result.id);
      state.authAccount = {id: result.id, email: result.email};
      state.authShownCode = result.resetCode;
      state.authShownCodeFor = result.email;
      state.authBusy = false;
      state.authPhase = 'resetCodeShown';
      render();
    }catch(err){
      console.error(err);
      state.authBusy = false;
      state.authError = '登録に失敗しました。もう一度お試しください。';
      render();
    }
  }

  async function submitAuthLogin(){
    var f = state.authForm;
    var email = (f.email||'').trim();
    if (!email || !f.password){ state.authError = 'メールアドレスとパスワードを入力してください。'; render(); return; }
    state.authBusy = true; state.authError = null; render();
    try{
      var result = await attemptManagerLogin(email, f.password);
      state.authBusy = false;
      if (!result.ok){ state.authError = result.error; render(); return; }
      setStoredManagerAccountId(result.account.id);
      state.authAccount = result.account;
      state.authPhase = null;
      proceedAuthed();
    }catch(err){
      console.error(err);
      state.authBusy = false;
      state.authError = 'ログインに失敗しました。もう一度お試しください。';
      render();
    }
  }

  async function submitAuthReset(){
    var f = state.authForm;
    var email = (f.email||'').trim();
    if (!email || !f.resetCode){ state.authError = 'メールアドレスと再設定コードを入力してください。'; render(); return; }
    if ((f.password||'').length < 8){ state.authError = 'パスワードは8文字以上にしてください。'; render(); return; }
    if (f.password !== f.passwordConfirm){ state.authError = 'パスワード（確認）が一致しません。'; render(); return; }
    state.authBusy = true; state.authError = null; render();
    try{
      var result = await attemptManagerReset(email, f.resetCode, f.password);
      state.authBusy = false;
      if (!result.ok){ state.authError = result.error; render(); return; }
      setStoredManagerAccountId(result.account.id);
      state.authAccount = result.account;
      state.authShownCode = result.resetCode;
      state.authShownCodeFor = result.account.email;
      state.authPhase = 'resetCodeShown';
      render();
    }catch(err){
      console.error(err);
      state.authBusy = false;
      state.authError = '再設定に失敗しました。もう一度お試しください。';
      render();
    }
  }

  function continueFromResetCodeShown(){
    state.authShownCode = null; state.authShownCodeFor = null;
    state.authPhase = null;

  }

  function managerLogout(){
    clearStoredManagerAccountId();
    state.authAccount = null;

    state.authForm = { email:'', password:'', passwordConfirm:'', resetCode:'' };
    state.authError = null;
    state.view = 'sessions';
    teardown();
    checkAuthAndProceed();
  }

  async function submitAddAdmin(){
    var f = state.addAdminForm;
    var email = (f.email||'').trim();
    if (!isValidEmailFormat(email)){ state.addAdminError = 'メールアドレスの形式が正しくありません。'; render(); return; }
    if ((f.password||'').length < 8){ state.addAdminError = 'パスワードは8文字以上にしてください。'; render(); return; }
    if (f.password !== f.passwordConfirm){ state.addAdminError = 'パスワード（確認）が一致しません。'; render(); return; }
    state.addAdminBusy = true; state.addAdminError = null; render();
    try{
      var existing = await findManagerAccountByEmail(normalizeEmail(email));
      if (existing){
        state.addAdminBusy = false;
        state.addAdminError = 'このメールアドレスはすでに登録されています。';
        render(); return;
      }
      var result = await createManagerAccount(email, f.password, state.authAccount ? state.authAccount.id : null);
      await fetchAdminAccounts();
      state.addAdminBusy = false;
      state.addingAdmin = false;
      state.newAdminShownCode = result.resetCode;
      state.newAdminShownFor = result.email;
      render();
    }catch(err){
      console.error(err);
      state.addAdminBusy = false;
      state.addAdminError = '追加に失敗しました。もう一度お試しください。';
      render();
    }
  }

  function groupFilterChipsHtml(){
    var groupNames = new Set(state.groups.map(function(g){ return g.name; }));
    var counts = {};
    state.entries.forEach(function(e){
      var gn = (e.groupNumber||'').trim();
      var key = (gn && groupNames.has(gn)) ? gn : '__unclassified__';
      counts[key] = (counts[key]||0) + 1;
    });
    var chips = [{key:null, label:'すべて', n: state.entries.length}];

      var active = state.groupFilter === c.key;
      return '<button class="chip-filter' + (active?' active':'') + '" data-filter-group="' + esc(c.key==null?'':c.key) + '">' + esc(c.label) + ' (' + c.n + ')</button>';
    }).join('') + '</div>';
  }

  function progressControlHtml(){
    var hasSections = state.sections.length > 0;
    var idx = hasSections ? Math.max(0, Math.min(state.currentSession.currentSectionIndex||0, state.sections.length-1)) : -1;
    var current = hasSections ? state.sections[idx] : null;
    var activePhase = getActivePhase(state.currentSession);
    var editingSec = state.editingSectionId ? state.sections.find(function(s){ return s.id === state.editingSectionId; }) : null;
    var prevDisabled = (activePhase === 'before');
    var nextDisabled = (activePhase !== 'before') && (idx >= state.sections.length-1);
    return (
      '<section class="block">' +
        '<h2>進行状況</h2>' +
        '<div class="section-pills">' +
          beforePillHtml(activePhase==='before') +
          (hasSections ? state.sections.map(function(sec, i){ return sectionPillHtml(sec, activePhase==='section' && i===idx); }).join('') : '') +
          reflectionPillHtml(activePhase==='reflection') +
        '</div>' +
        (editingSec ? sectionEditPanelHtml(editingSec) : '') +
        (state.editingReflection ? reflectionEditPanelHtml() : '') +
        (hasSections ? (
          '<div style="display:flex; gap:.5rem; margin-top:.9rem; flex-wrap:wrap;">' +
            '<button class="btn-sm" id="prev-section-btn" ' + (prevDisabled?'disabled':'') + '>◀ 前へ戻る</button>' +
            '<button class="primary-btn" id="next-section-btn" style="flex:1;" ' + (nextDisabled?'disabled':'') + '>次の問いに進む ▶</button>' +
          '</div>'
        ) : '') +
        '<button class="btn-sm" id="add-section-btn" style="margin-top:.6rem;">＋ 問いを追加</button>' +
        '<p class="hint">' +
          (activePhase==='before'
            ? '現在「記録開始前」が参加者の画面に表示されています。参加者は音声入力や写真追加の動作確認ができますが、記録の送信はできません。'
            : activePhase==='reflection'
            ? '現在「全体のふりかえり」が参加者の画面に表示されています。'
            : '現在の問い「' + esc(current?current.name:'—') + '」が参加者の画面にリアルタイムで表示され、追加される記録はこの問いとして記録されます。') +
          ' 各問いの✎から、名前の変更と「写真の撮り方についての要望」を設定できます。「全体のふりかえり」の✎からは、事後アンケートの内容を設定でき、ピルをクリックするといつでも参加者の画面を切り替えられます。' +
        '</p>' +
      '</section>'
    );
  }

  function beforePillHtml(active){
    return (
      '<span class="section-pill before' + (active?' active':'') + '" data-jump-before="1">' +
        '記録開始前' +
      '</span>'
    );
  }

          '</div>' +
          '<p class="hint" style="margin-top:-.2rem;">「匿名」を選ぶと、記入者名の入力欄自体が参加者の画面に表示されなくなります。所属グループは、記名の設定にかかわらず自動的に記録されます。</p>' +

        '<div style="display:flex; gap:.5rem; flex-wrap:wrap; margin:.3rem 0 .9rem;">' +

  function reflectionQuestionRowHtml(q, i){

    return (
      '<div class="rf-question-row">' +
        '<div class="rf-q-type-row">' +
          '<span class="chip">' + (isScore ? '📊 点数評価' : '✏️ 文章記述') + '</span>' +

            '</select></label>') : '') +
          '<button class="rf-remove-btn" data-rm-rf-question="' + i + '" style="margin-left:auto;">✕ 削除</button>' +
        '</div>' +
        '<input type="text" data-rf-question-label="' + i + '" value="' + esc(q.label||'') + '" placeholder="設問の内容を入力してください">' +

  function sectionFilterChipsHtml(){
    var sectionNames = new Set(state.sections.map(function(s){ return s.name; }));
    var counts = {};
    state.entries.forEach(function(e){
      var sn = (e.section||'').trim();

    return '<div class="chip-row">' + chips.map(function(c){
      var active = state.sectionFilter === c.key;
      return '<button class="chip-filter' + (active?' active':'') + '" data-filter-section="' + esc(c.key==null?'':c.key) + '">' + esc(c.label) + ' (' + c.n + ')</button>';
    }).join('') + '</div>';
  }

  function reflectionResponsesSectionHtml(){
    var cfg = getReflectionConfig(state.currentSession);
    var responses = state.reflectionResponses;
    if (!cfg.questions.length && !responses.length) return '';
    return (
      '<section class="block">' +
        '<h2>全体のふりかえり回答 <span class="hint" style="margin:0;">(' + responses.length + ' 件)</span></h2>' +
        (!cfg.questions.length ? '<p class="hint" style="margin-top:-.3rem;">まだ設問が設定されていません。「進行状況」の「全体のふりかえり」の✎から設問を設定してください。</p>' :
          (responses.length ? responses.map(function(r){ return reflectionResponseCardHtml(r, cfg); }).join('') :
            '<p class="hint" style="margin-top:-.3rem;">まだ回答が集まっていません。「進行状況」の「全体のふりかえり」ピルをクリックすると、参加者の画面をアンケートに切り替えられます。</p>')) +
      '</section>'
    );

  function reflectionResponseCardHtml(r, cfg){
    var nameLabel = r.anonymous ? '匿名' : (r.name || '記入者不明');
    return (
      '<div class="reflection-response-card">' +
        '<div class="entry-top" style="margin-bottom:.5rem;">' +
          '<span class="who">' + esc(nameLabel) + '</span>' +
          (r.groupNumber ? '<span class="chip">グループ ' + esc(r.groupNumber) + '</span>' : '') +
          '<span class="time">' + esc(formatTime(r.createdAt)) + '</span>' +
        '</div>' +
        cfg.questions.map(function(q){
          var ans = (r.answers||{})[q.id];
          if (q.type === 'score'){
            return '<p style="margin:.3rem 0; font-size:.85rem;"><b style="color:var(--ink);">' + esc(q.label) + '</b>　' +
              (ans!=null && ans!=='' ? '<span style="font-weight:700; color:var(--reflect);">' + esc(ans) + ' / ' + (q.scoreMax||5) + '</span>' : '<span class="hint" style="display:inline;">未回答</span>') +
              '</p>';
          }
          return '<p style="margin:.3rem 0; font-size:.85rem;"><b style="color:var(--ink);">' + esc(q.label) + '</b><br>' + (ans ? nl2br(ans) : '<span class="hint">未回答</span>') + '</p>';
        }).join('') +
        '<button class="icon-btn" data-del-reflection="' + r.id + '" aria-label="削除">🗑</button>' +
      '</div>'
    );
  }

  function swatchForGroupName(name){
    var idx = state.groups.findIndex(function(g){ return g.name === name; });
    if (idx < 0) return null;
    return 'var(--swatch-' + ((idx % 5) + 1) + ')';
  }

  function renderEntry(e){
    var open = state.expandedId === e.id;
    var photos = state.entryPhotos[e.id];
    var swatch = e.groupNumber ? swatchForGroupName(e.groupNumber.trim()) : null;
    return (
      '<article class="entry"' + (swatch ? ' style="border-left-color:' + swatch + ';"' : '') + '>' +
        '<label class="pick"><input type="checkbox" class="pick-box" data-id="' + e.id + '" ' + (state.selected.has(e.id)?'checked':'') + '></label>' +
        '<div style="flex:1; min-width:0;">' +
          '<div class="entry-main" data-toggle="' + e.id + '">' +
            '<div class="entry-top">' +
              '<span class="who">' + esc(e.attendees || '記入者不明') + '</span>' +
              (e.groupNumber ? '<span class="chip">グループ ' + esc(e.groupNumber) + '</span>' : '') +
              (e.section ? '<span class="chip chip-section">' + esc(e.section) + '</span>' : '') +
              (e.photoCount ? '<span class="chip">📷 ' + e.photoCount + '</span>' : '') +
              '<span class="time">' + esc(formatTime(e.createdAt)) + '</span>' +
            '</div>' +
            (!open ? '<p class="preview">' + esc(truncate(e.transcript,70) || '（書き起こしなし）') + '</p>' : '') +
          '</div>' +
          (open ? (
            '<div class="entry-detail">' +
              '<p class="full">' + esc(e.transcript || '（書き起こしなし）') + '</p>' +
              (photos == null ? '<p class="hint">写真を読み込み中…</p>' :
                (photos.length ? '<div class="photo-grid">' + photos.map(function(p){
                  return '<div class="photo-tile"><img src="' + p.dataUrl + '" alt=""></div>';
                }).join('') + '</div>' : '')
              ) +
            '</div>'
          ) : '') +
        '</div>' +
        '<button class="icon-btn" data-del-entry="' + e.id + '" aria-label="削除">🗑</button>' +
      '</article>'
    );
  }

  function bindView(){
    if (state.view === 'sessions'){
      var newBtn = document.getElementById('new-session-btn');
      if (newBtn) newBtn.addEventListener('click', function(){ state.view='new'; state.newForm={title:'',dateISO:todayISO(),groupCount:0,sectionCount:0,purpose:'',location:'',participants:'',participantCount:'',industry:'',askAbout:true,groupJoinMode:'both'}; state.debugNote=null; render(); });
      document.querySelectorAll('[data-open]').forEach(function(c){
        c.addEventListener('click', function(){ openSession(c.dataset.open); });
      });
      var gotoAdminsBtn = document.getElementById('goto-admins-btn');
      if (gotoAdminsBtn) gotoAdminsBtn.addEventListener('click', openAdmins);
      var logoutBtn2 = document.getElementById('manager-logout-btn2');
      if (logoutBtn2) logoutBtn2.addEventListener('click', managerLogout);

      renderParticipantEntryQr();
      var copyEntryBtn = document.getElementById('copy-participant-entry-link-btn');
      if (copyEntryBtn) copyEntryBtn.addEventListener('click', async function(){
        var input = document.getElementById('participant-entry-link-text');
        input.focus(); input.select();
        try{ await navigator.clipboard.writeText(input.value); toast('リンクをコピーしました'); }
        catch(e){ toast('コピーできませんでした。テキストを選択してコピーしてください'); }
      });
    }

    if (state.view === 'admins'){
      var addAdminBtn = document.getElementById('add-admin-btn');
      if (addAdminBtn) addAdminBtn.addEventListener('click', function(){
        state.addingAdmin = true; state.addAdminForm = {email:'', password:'', passwordConfirm:''}; state.addAdminError = null; render();
      });
      var cancelNewAdminBtn = document.getElementById('cancel-new-admin-btn');
      if (cancelNewAdminBtn) cancelNewAdminBtn.addEventListener('click', function(){
        state.addingAdmin = false; state.addAdminError = null; render();
      });
      var aaEmail = document.getElementById('aa-email'), aaPass = document.getElementById('aa-password'), aaPassConfirm = document.getElementById('aa-password-confirm');
      if (aaEmail) aaEmail.addEventListener('input', function(){ state.addAdminForm.email = aaEmail.value; });
      if (aaPass) aaPass.addEventListener('input', function(){ state.addAdminForm.password = aaPass.value; });
      if (aaPassConfirm) aaPassConfirm.addEventListener('input', function(){ state.addAdminForm.passwordConfirm = aaPassConfirm.value; });
      var saveNewAdminBtn = document.getElementById('save-new-admin-btn');
      if (saveNewAdminBtn) saveNewAdminBtn.addEventListener('click', submitAddAdmin);
      var copyNewAdminCodeBtn = document.getElementById('copy-new-admin-code-btn');
      if (copyNewAdminCodeBtn) copyNewAdminCodeBtn.addEventListener('click', async function(){
        try{ await navigator.clipboard.writeText(state.newAdminShownCode||''); toast('再設定コードをコピーしました'); }
        catch(e){ toast('コピーできませんでした。表示されたコードを選択してコピーしてください'); }
      });
      var dismissNewAdminCodeBtn = document.getElementById('dismiss-new-admin-code-btn');
      if (dismissNewAdminCodeBtn) dismissNewAdminCodeBtn.addEventListener('click', function(){
        state.newAdminShownCode = null; state.newAdminShownFor = null; render();
      });
      var logoutBtn = document.getElementById('manager-logout-btn');
      if (logoutBtn) logoutBtn.addEventListener('click', managerLogout);
    }

    if (state.view === 'new'){
      var t=document.getElementById('nf-title'), dt=document.getElementById('nf-date'), gc=document.getElementById('nf-groups'), sc=document.getElementById('nf-sections');
      var pu=document.getElementById('nf-purpose'), lo=document.getElementById('nf-location'), pa=document.getElementById('nf-participants');
      var pc=document.getElementById('nf-participant-count'), ind=document.getElementById('nf-industry');
      var ab=document.getElementById('nf-ask-about');
      if (t) t.addEventListener('input', function(){ state.newForm.title = t.value; });
      if (dt) dt.addEventListener('input', function(){ state.newForm.dateISO = dt.value; });
      if (pu) pu.addEventListener('input', function(){ state.newForm.purpose = pu.value; });
      if (lo) lo.addEventListener('input', function(){ state.newForm.location = lo.value; });
      if (pa) pa.addEventListener('input', function(){ state.newForm.participants = pa.value; });
      if (pc) pc.addEventListener('input', function(){ state.newForm.participantCount = pc.value; });
      if (ind) ind.addEventListener('input', function(){ state.newForm.industry = ind.value; });
      if (gc) gc.addEventListener('change', function(){ state.newForm.groupCount = Number(gc.value)||0; });
      if (sc) sc.addEventListener('change', function(){ state.newForm.sectionCount = Number(sc.value)||0; });
      if (ab) ab.addEventListener('change', function(){ state.newForm.askAbout = ab.checked; });
      document.querySelectorAll('input[name="nf-group-join-mode"]').forEach(function(r){
        r.addEventListener('change', function(){ if (r.checked) state.newForm.groupJoinMode = r.value; });
      });
      var createBtn = document.getElementById('create-session-btn');
      if (createBtn) createBtn.addEventListener('click', createSession);
    }

    if (state.view === 'detail'){
      if (!state.groups.length) renderQr();

      var copyBtn = document.getElementById('copy-link-btn');
      if (copyBtn) copyBtn.addEventListener('click', async function(){
        var input = document.getElementById('link-text');
        input.focus(); input.select();
        try{ await navigator.clipboard.writeText(input.value); toast('リンクをコピーしました'); }
        catch(e){ toast('コピーできませんでした。テキストを選択してコピーしてください'); }
      });

      document.querySelectorAll('[data-copy-code]').forEach(function(btn){
        btn.addEventListener('click', async function(){
          var code = btn.dataset.copyCode;
          if (!code) return;
          try{ await navigator.clipboard.writeText(code); toast('参加コードをコピーしました'); }
          catch(e){ toast('コピーできませんでした。コードを選択してコピーしてください'); }
        });
      });

      document.querySelectorAll('[data-rename-group]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.dataset.renameGroup;
          var g = state.groups.find(function(x){ return x.id === id; });
          if (!g) return;
          state.editingGroupId = id;
          state.groupEditDraft = {name: g.name};
          render();
        });
      });
      var geName = document.getElementById('ge-name');
      if (geName) geName.addEventListener('input', function(){ state.groupEditDraft.name = geName.value; });
      var saveGroupBtn = document.querySelector('[data-save-group]');
      if (saveGroupBtn) saveGroupBtn.addEventListener('click', async function(){
        var id = saveGroupBtn.dataset.saveGroup;
        var name = (state.groupEditDraft.name||'').trim();
        if (!name){ toast('グループ名を入力してください'); return; }
        await dbApi.doc('sessions/'+state.currentId+'/groups/'+id).update({name:name, updatedAt:new Date().toISOString()});
        state.editingGroupId = null; state.groupEditDraft = null;
        toast('更新しました');
        render();
      });
      var cancelGroupBtn = document.querySelector('[data-cancel-group]');
      if (cancelGroupBtn) cancelGroupBtn.addEventListener('click', function(){ state.editingGroupId = null; state.groupEditDraft = null; render(); });

      document.querySelectorAll('[data-del-group]').forEach(function(btn){
        btn.addEventListener('click', async function(){
          var id = btn.dataset.delGroup;
          var ok = await confirmModal('このグループの参加コードを削除します。既に集まった記録は削除されません。よろしいですか？','削除する');
          if (ok){
            var g = state.groups.find(function(x){ return x.id === id; });
            if (g && g.joinCode) await releaseJoinCode(g.joinCode);
            await dbApi.doc('sessions/'+state.currentId+'/groups/'+id).delete();
            if (g && state.groupFilter === g.name) state.groupFilter = null;
            toast('グループを削除しました');
          }
        });
      });

      var addGroupBtn = document.getElementById('add-group-btn');
      if (addGroupBtn) addGroupBtn.addEventListener('click', async function(){
        addGroupBtn.disabled = true; addGroupBtn.textContent = '追加中…';
        try{
          var n = state.groups.length;
          var name = n < 26 ? String.fromCharCode(65+n) : String(n+1);
          var newGroupRef = await addDoc('sessions/'+state.currentId+'/groups', {name:name, order:n, createdAt:new Date().toISOString()});
          var newGroupCode = await allocateJoinCode(state.currentId, newGroupRef.id);
          await dbApi.doc('sessions/'+state.currentId+'/groups/'+newGroupRef.id).update({joinCode: newGroupCode});
          toast('グループを追加しました');
        }catch(err){
          console.error(err);
          toast('追加に失敗しました。もう一度お試しください');
        }finally{
          addGroupBtn.disabled = false; addGroupBtn.textContent = '＋ グループを追加';
        }
      });

      document.querySelectorAll('[data-filter-group]').forEach(function(btn){

     data
  ============================================================ */
  function goSessions(){
    if (unsubCurrent) { unsubCurrent(); unsubCurrent = null; }
    if (unsubEntries) { unsubEntries(); unsubEntries = null; }
    if (unsubGroups) { unsubGroups(); unsubGroups = null; }
    if (unsubSections) { unsubSections(); unsubSections = null; }
    if (unsubReflection) { unsubReflection(); unsubReflection = null; }
    state.view = 'sessions';
    state.currentId = null; state.currentSession = null; state.entries = [];
    state.entryPhotos = {}; state.expandedId = null; state.selected = new Set();
    state.editingSession = false; state.sessionEditDraft = null;
    state.groups = []; state.groupFilter = null; state.editingGroupId = null; state.groupEditDraft = null;
    state.sections = []; state.sectionFilter = null; state.editingSectionId = null; state.sectionEditDraft = null;
    state.reflectionResponses = []; state.editingReflection = false; state.reflectionEditDraft = null;
    state.debugNote = null;
    render();
  }

  // preload (optional): {debugNote, groups, sections, session} — data we already
  // fetched directly (e.g. right after creating a folder) so the very first paint
  // is correct without waiting on the live subscription below, which has been
  // observed to sometimes not deliver its first update promptly even though the
  // data is confirmed to exist via a plain get().
  // Backfill join codes for folders/groups created before this feature
  // existed. Cheap to call repeatedly (self-guards with __joinCodeLock and
  // no-ops once nothing is missing) — called from the session-doc and
  // groups-collection listeners below so it naturally retries as real
  // data arrives instead of racing them.
  var __joinCodeLock = {};
  // Set true only once a REAL snapshot (not just the initial empty state)
  // has been delivered for each — otherwise the groups listener's
  // momentarily-empty initial state (before its first delivery) can look
  // just like "this folder truly has zero groups" and wrongly hand out a
  // session-level code to a folder that does have groups.
  var __sessionDocSeen = {}, __groupsSeen = {};
  async function ensureJoinCodes(){
    var sid = state.currentId;
    if (!sid || __joinCodeLock[sid]) return;
    if (!__sessionDocSeen[sid] || !__groupsSeen[sid]) return;
    var needsSessionCode = !!(state.currentSession && !state.currentSession.joinCode && state.groups.length === 0);
    var missingGroups = state.groups.filter(function(g){ return !g.joinCode; });
    if (!needsSessionCode && !missingGroups.length) return;
    __joinCodeLock[sid] = true;
    try{
      if (needsSessionCode){
        var code = await allocateJoinCode(sid, null);
        await dbApi.doc('sessions/'+sid).update({joinCode: code});
      }
      for (var i=0;i<missingGroups.length;i++){
        var gcode = await allocateJoinCode(sid, missingGroups[i].id);
        await dbApi.doc('sessions/'+sid+'/groups/'+missingGroups[i].id).update({joinCode: gcode});
      }
    }catch(e){ console.warn('join code backfill failed', e); }
    finally{ __joinCodeLock[sid] = false; }
  }

  function openSession(id, preload){
    preload = preload || {};
    state.currentId = id;
    state.view = 'detail';
    state.entryPhotos = {}; state.expandedId = null; state.selected = new Set();
    state.editingSession = false; state.sessionEditDraft = null;
    state.groups = preload.groups || []; state.groupFilter = null; state.editingGroupId = null; state.groupEditDraft = null;
    state.sections = preload.sections || []; state.sectionFilter = null; state.editingSectionId = null; state.sectionEditDraft = null;
    state.reflectionResponses = []; state.editingReflection = false; state.reflectionEditDraft = null;
    if (preload.session) state.currentSession = preload.session;
    state.debugNote = preload.debugNote != null ? preload.debugNote : null;
    render();
    if (unsubCurrent) unsubCurrent();
    if (unsubEntries) unsubEntries();
    if (unsubGroups) unsubGroups();
    if (unsubSections) unsubSections();
    if (unsubReflection) unsubReflection();
    unsubCurrent = dbApi.doc('sessions/'+id).onSnapshot(function(snap){
      if (snap.exists){ state.currentSession = snap.data(); __sessionDocSeen[id] = true; if (state.view==='detail') render(); ensureJoinCodes(); }
    });
    unsubEntries = dbApi.collection('sessions/'+id+'/entries').orderBy('createdAt','desc').limit(500).onSnapshot(
      function(qs){
        state.entries = qs.docs.map(function(d){ var data=Object.assign({}, d.data()||{}, {id:d.id}); return data; });
        var validIds = new Set(state.entries.map(function(e){return e.id;}));
        state.selected.forEach(function(id2){ if(!validIds.has(id2)) state.selected.delete(id2); });
        if (state.view === 'detail') render();
      },
      function(err){
        console.warn('entries onSnapshot error', err);
        state.debugNote = (state.debugNote ? state.debugNote+'\n' : '') + '記録の購読エラー: ' + (err && err.code) + ' ' + (err && err.message);
        if (state.view === 'detail') render();
      }
    );
    unsubGroups = dbApi.collection('sessions/'+id+'/groups').orderBy('order','asc').limit(200).onSnapshot(
      function(qs){
        state.groups = qs.docs.map(function(d){ var data=Object.assign({}, d.data()||{}, {id:d.id}); return data; });
        __groupsSeen[id] = true;
        if (state.groupFilter && state.groupFilter !== '__unclassified__' && !state.groups.some(function(g){ return g.name === state.groupFilter; })){
          state.groupFilter = null;
        }
        if (state.view === 'detail') render();
        ensureJoinCodes();
      },
      function(err){
        console.warn('groups onSnapshot error', err);
        state.debugNote = (state.debugNote ? state.debugNote+'\n' : '') + 'グループの購読エラー: ' + (err && err.code) + ' ' + (err && err.message);
        if (state.view === 'detail') render();
      }
    );
    unsubSections = dbApi.collection('sessions/'+id+'/sections').orderBy('order','asc').limit(200).onSnapshot(
      function(qs){
        state.sections = qs.docs.map(function(d){ var data=Object.assign({}, d.data()||{}, {id:d.id}); return data; });
        if (state.sectionFilter && state.sectionFilter !== '__unclassified__' && !state.sections.some(function(s){ return s.name === state.sectionFilter; })){
          state.sectionFilter = null;
        }
        if (state.view === 'detail') render();
      },
      function(err){
        console.warn('sections onSnapshot error', err);
        state.debugNote = (state.debugNote ? state.debugNote+'\n' : '') + '問いの購読エラー: ' + (err && err.code) + ' ' + (err && err.message);
        if (state.view === 'detail') render();
      }
    );
    unsubReflection = dbApi.collection('sessions/'+id+'/reflectionResponses').orderBy('createdAt','desc').limit(500).onSnapshot(
      function(qs){
        state.reflectionResponses = qs.docs.map(function(d){ var data=Object.assign({}, d.data()||{}, {id:d.id}); return data; });
        if (state.view === 'detail') render();
      },
      function(err){
        console.warn('reflectionResponses onSnapshot error', err);
        state.debugNote = (state.debugNote ? state.debugNote+'\n' : '') + 'ふりかえり回答の購読エラー: ' + (err && err.code) + ' ' + (err && err.message);
        if (state.view === 'detail') render();
      }
    );
  }

  function getFilteredEntries(){
    var entries = state.entries;
    if (state.groupFilter != null){
      var groupNames = new Set(state.groups.map(function(g){ return g.name; }));
      entries = entries.filter(function(e){
        var gn = (e.groupNumber||'').trim();
        if (state.groupFilter === '__unclassified__') return !gn || !groupNames.has(gn);
        return gn === state.groupFilter;
      });
    }
    if (state.sectionFilter != null){
      var sectionNames = new Set(state.sections.map(function(s){ return s.name; }));
      entries = entries.filter(function(e){
        var sn = (e.section||'').trim();
        if (state.sectionFilter === '__unclassified__') return !sn || !sectionNames.has(sn);
        return sn === state.sectionFilter;
      });
    }
    return entries;
  }

  async function createSession(){
    var f = state.newForm;
    if (!f.title.trim()){ toast('件名を入力してください'); return; }
    var groupCount = Number(f.groupCount) || 0;
    if (groupCount < 0) groupCount = 0;
    if (groupCount > 50) groupCount = 50;
    var sectionCount = Number(f.sectionCount) || 0;
    if (sectionCount < 0) sectionCount = 0;
    if (sectionCount > 50) sectionCount = 50;
    var btn = document.getElementById('create-session-btn');
    btn.disabled = true; btn.textContent = '作成中…';
    var debugLines = [];
    debugLines.push('選択: グループ' + groupCount + ' / 問い' + sectionCount);
    try{
      var now = new Date().toISOString();
      var sessionData = {title:f.title.trim(), dateISO: f.dateISO || todayISO(), purpose:(f.purpose||'').trim(), location:(f.location||'').trim(), participants:(f.participants||'').trim(), participantCount:(f.participantCount||'').trim(), industry:(f.industry||'').trim(), askAbout: f.askAbout !== false, groupJoinMode: getGroupJoinMode(f), createdAt:now, updatedAt:now};
      if (sectionCount > 0) sessionData.currentSectionIndex = 0;
      var ref = await addDoc('sessions', sessionData);
      debugLines.push('セッション作成: id=' + ref.id);
      // Create groups/sections one at a time, each with our own explicit id
      // (see addDoc/newId above) rather than the db capability's built-in
      // add()/auto-id, then read back to confirm every document really
      // landed — retrying any that are missing — before showing the folder.
      var preloadGroups = [], preloadSections = [];
      if (groupCount > 0){
        for (var i=0;i<groupCount;i++){
          try{
            await addDoc('sessions/'+ref.id+'/groups', {name: generateGroupName(i, groupCount), order:i, createdAt: now});
          }catch(addErr){
            debugLines.push('グループ' + i + '個目の作成でエラー: ' + (addErr && addErr.code) + ' ' + (addErr && addErr.message));
          }
        }
        await ensureCount('sessions/'+ref.id+'/groups', groupCount, function(i){ return {name: generateGroupName(i, groupCount), order:i, createdAt: now}; });
        var groupCheck = await dbApi.collection('sessions/'+ref.id+'/groups').orderBy('order','asc').get();
        debugLines.push('グループ読み直し結果: ' + groupCheck.docs.length + '/' + groupCount + '件');
        preloadGroups = groupCheck.docs.map(function(d){ var data=Object.assign({}, d.data()||{}, {id:d.id}); return data; });
        // Each group gets its own short join code — this is the mechanism
        // participants actually use to jump straight to their group's
        // entry screen (URL params cannot make that trip on this hosting
        // platform; see the join-code helpers above).
        for (var gi=0; gi<preloadGroups.length; gi++){
          if (!preloadGroups[gi].joinCode){
            var gCode = await allocateJoinCode(ref.id, preloadGroups[gi].id);
            await dbApi.doc('sessions/'+ref.id+'/groups/'+preloadGroups[gi].id).update({joinCode: gCode});
            preloadGroups[gi].joinCode = gCode;
          }
        }
      } else {
        // No groups configured — give the folder itself a join code so
        // participants can still jump straight past the picker.
        var sessionCode = await allocateJoinCode(ref.id, null);
        await dbApi.doc('sessions/'+ref.id).update({joinCode: sessionCode});
        sessionData.joinCode = sessionCode;
        debugLines.push('参加コード: ' + sessionCode);
      }
      if (sectionCount > 0){
        for (var j=0;j<sectionCount;j++){
          try{
            await addDoc('sessions/'+ref.id+'/sections', {name: generateSectionName(j), order:j, createdAt: now});
          }catch(addErr){
            debugLines.push('問い' + j + '個目の作成でエラー: ' + (addErr && addErr.code) + ' ' + (addErr && addErr.message));
          }
        }
        await ensureCount('sessions/'+ref.id+'/sections', sectionCount, function(j){ return {name: generateSectionName(j), order:j, createdAt: now}; });
        var sectionCheck = await dbApi.collection('sessions/'+ref.id+'/sections').orderBy('order','asc').get();
        debugLines.push('問い読み直し結果: ' + sectionCheck.docs.length + '/' + sectionCount + '件');
        preloadSections = sectionCheck.docs.map(function(d){ var data=Object.assign({}, d.data()||{}, {id:d.id}); return data; });
      }
      toast('フォルダを作成しました');
      // Seed the detail view directly from what we just confirmed via get()
      // instead of waiting on the live onSnapshot subscription for its first
      // delivery — that subscription has been observed to sometimes lag behind
      // a plain get() on the very same, just-written collection.
      openSession(ref.id, {debugNote: debugLines.join('\n'), groups: preloadGroups, sections: preloadSections, session: sessionData});
    }catch(err){
      console.error(err);
      debugLines.push('作成処理で例外: ' + (err && err.code) + ' ' + (err && err.message));
      state.debugNote = debugLines.join('\n');
      toast('作成に失敗しました。もう一度お試しください');
      btn.disabled = false; btn.textContent = '記録帳を作成する';
      render();
    }
  }

  /* ============================================================
     raw data export (CSV + photos) — unlike the PDF/PPTX buttons
     above this needs no AI summarization, just the entries and
     photos exactly as recorded.
     NOTE: the downloads capability only accepts a fixed extension
     allowlist (gif/png/jpg/jpeg/webp/mp4/webm/txt/json/md/docx/pptx/
     epub/csv/ttf/html/svg/pdf) — .zip is rejected outright (code
     "rejected_extension"), so a single zipped "folder" download is
     not possible here. Instead we save the CSV as its own file, then
     each photo as its own .jpg, one save() prompt at a time, with
     filenames that cross-reference the CSV's 写真ファイル column so
     the viewer can regroup them into a folder themselves.
  ============================================================ */
  function csvCell(v){
    var s = String(v==null ? '' : v);
    if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  function pad2(n){ return (n<10?'0':'') + n; }
  function formatDateTimeForCsv(iso){
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function dataUrlToBlob(dataUrl){
    var commaIdx = dataUrl.indexOf(',');
    var meta = commaIdx >= 0 ? dataUrl.slice(0, commaIdx) : '';
    var base64 = commaIdx >= 0 ? dataUrl.slice(commaIdx+1) : '';
    var mimeMatch = meta.match(/data:([^;]+)/);
    var mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    var binary = atob(base64);
    var len = binary.length;
    var bytes = new Uint8Array(len);
    for (var i=0;i<len;i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], {type: mime});
  }
  function downloadsErrorMessage(err){
    var code = err && err.code;
    if (code === 'declined') return 'ダウンロードがキャンセルされました。';
    if (code === 'rate_limited') return '保存の確認が続いています。少し待ってからもう一度お試しください。';
    if (code === 'too_large') return 'ファイルが大きすぎて保存できませんでした。';
    return 'ダウンロードの作成に失敗しました。もう一度お試しください。';
  }
